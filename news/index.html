<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="What's new in Moogo — releases, features, and fixes, straight from the team." />
    <!-- Favicon and og:image share one PNG, same as the main site, so a
         shared post — index, release, post — previews the same mark. The
         file is on this site's own origin (public/img), so a crawler
         fetching the preview never depends on a third party. -->
    <link rel="icon" type="image/png" href="/img/moogo_logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moogo" />
    <meta property="og:title" content="What's new — Moogo" />
    <meta property="og:description" content="What's new in Moogo — releases, features, and fixes, straight from the team." />
    <meta
      property="og:image"
      content="https://news.moogo.dev/img/moogo_logo.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="What's new — Moogo" />
    <meta name="twitter:description" content="What's new in Moogo — releases, features, and fixes, straight from the team." />
    <meta
      name="twitter:image"
      content="https://news.moogo.dev/img/moogo_logo.png"
    />
    <title>What's new — Moogo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
