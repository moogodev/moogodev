name: Feature request
description: Describe the task you were trying to complete, not the feature you would add.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The most useful requests describe a **task you were trying to complete**.
        "Add more file types" tells us little; the story of what you were building
        tells us everything. See [Feedback](https://moogo.dev/docs/feedback).
  - type: textarea
    id: task
    attributes:
      label: What were you trying to complete
      description: The real-world task, not the API you imagine it would need.
      placeholder: "I wanted to serve avatars from a Cloudflare Worker, but the docs pattern needs a credential a browser cannot send…"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What got in the way
      description: Where Moogo's current behaviour stopped you, and any workaround you tried.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: Optional — your idea, or the shape of a solution if you have one.
  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options:
        - Dashboard
        - SQL API
        - Storage API
        - Documentation
        - Other / not sure
