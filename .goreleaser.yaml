project_name: moogo

builds:
  - id: moogo
    main: ./cmd/moogo
    binary: moogo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: moogo-tar
    builds:
      - moogo
    format: tar.gz
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*
